<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8cba8" />
  <link rel="icon" href="data:," />
  <title>(𝟸𝟻:𝟶𝟶) · focus</title>
  <style>
    :root {
      --ink:#382f2a;
      --muted:#6d5f56;
      --paper:rgba(255,250,244,.84);
      --line:rgba(75,54,42,.14);
      --coral:#df735b;
      --coral-dark:#b95143;
      --honey:#e8a93d;
      --focus-top:#f9cba9;
      --focus-bottom:#cae3df;
      --break-top:#bcd9df;
      --break-bottom:#dbe9d9;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,var(--focus-top),var(--focus-bottom));
      transition:background 2s ease;
      overscroll-behavior:none;
    }
    body.break-mode{background:linear-gradient(180deg,var(--break-top),var(--break-bottom))}
    button,input{font:inherit}
    button{color:inherit}
    #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .app{position:relative;z-index:2;width:100%;height:100%;min-height:520px;pointer-events:none}
    .phase-rail{
      pointer-events:auto;
      position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
      display:flex;gap:4px;padding:4px;border:1px solid rgba(255,255,255,.45);
      border-radius:999px;background:rgba(255,251,246,.57);box-shadow:0 8px 24px rgba(73,49,38,.07)
    }
    .phase-btn{
      border:0;border-radius:999px;background:transparent;padding:8px 14px;font-size:12px;font-weight:700;
      letter-spacing:.02em;color:#69594f;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .2s
    }
    .phase-btn:hover{transform:translateY(-1px)}
    .phase-btn[aria-pressed="true"]{background:#fff7ef;color:#9c493d;box-shadow:0 2px 8px rgba(86,50,34,.08)}
    .top-tools{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));display:flex;gap:8px;pointer-events:auto}
    .talk-bubble{position:absolute;z-index:5;top:clamp(84px,14%,160px);left:50%;transform:translateX(-50%) translateY(10px);max-width:min(340px,calc(100vw - 48px));background:rgba(255,251,243,.96);border:1px solid rgba(255,255,255,.65);border-radius:18px;padding:14px 16px 8px;box-shadow:0 12px 32px rgba(73,49,38,.14);opacity:0;pointer-events:none;transition:opacity .32s ease,transform .32s ease}
    .talk-bubble.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
    .talk-bubble::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:15px;height:15px;background:rgba(255,251,243,.96);border-right:1px solid rgba(255,255,255,.65);border-bottom:1px solid rgba(255,255,255,.65)}
    .talk-bubble p{margin:0;min-height:3.4em;font-size:15px;line-height:1.5;color:#5b4a3f;cursor:pointer}
    .talk-bubble p strong{color:#3d2c22;font-weight:800}
    .talk-hint{display:block;text-align:right;font-size:10px;color:#a08b7a;margin-top:6px;letter-spacing:.05em}
    .icon-btn{
      width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.48);background:rgba(255,251,246,.58);
      box-shadow:0 8px 24px rgba(73,49,38,.07);display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s
    }
    .icon-btn:hover{transform:translateY(-1px);background:rgba(255,251,246,.82)}
    .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .control-dock{
      pointer-events:auto;position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));
      width:216px;height:216px;text-align:center;padding:15px 13px;
      background:linear-gradient(155deg,rgba(255,246,226,.90),rgba(236,225,199,.78));
      border:1px solid rgba(255,244,219,.7);border-radius:25px;
      box-shadow:0 18px 54px rgba(51,35,25,.18);display:flex;flex-direction:column;justify-content:center
    }
    .task-input{display:none}
    .task-input::placeholder{color:#87776d}
    .task-input:focus{border-color:var(--coral)}
    .phase-label{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a04d41}
    .time{font-variant-numeric:tabular-nums lining-nums;font-size:52.5px;font-weight:350;line-height:1;letter-spacing:.12em;margin:12px 0 18px;padding-left:.12em;white-space:nowrap}
    .minute-ones{display:inline-block;color:inherit}
    .minute-ones.minute-pulse{animation:minutePulse .6s cubic-bezier(.16,.8,.32,1)}
    .pots{position:fixed;z-index:3;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);height:52px;display:flex;justify-content:center;align-items:center;gap:10px;margin:0;padding:4px 10px;border-radius:18px;background:rgba(255,246,226,.46);backdrop-filter:blur(6px);pointer-events:none}
    .pot{width:44px;height:48px;position:relative;filter:drop-shadow(0 3px 4px rgba(84,58,36,.08));transition:filter .2s}
    .pot svg{width:100%;height:100%;overflow:visible}
    .pot-shell{fill:rgba(255,255,255,.25);stroke:#8b6b54;stroke-width:1.7}
    .pot-rim{fill:#d9b587;stroke:#8b6b54;stroke-width:1.5}
    .pot-highlight{fill:none;stroke:rgba(255,255,255,.78);stroke-width:1.6;stroke-linecap:round}
    .honey-fill{transform-origin:center bottom;transform:scaleY(0);transition:transform 0ms;fill:var(--honey)}
    .honey-surface{opacity:0;fill:#f6c66a;transform-origin:center center}
    .pot.filled .honey-fill{transform:scaleY(1)}
    .pot.just-filled .honey-fill{animation:fillRise .8s cubic-bezier(.16,.86,.23,1.12) both}
    .pot.filled .honey-surface{opacity:1}
    .pot.just-filled .honey-surface{animation:surfaceWobble .8s ease-out both}
    .dipper-stick{stroke:#9a7048;stroke-width:3;stroke-linecap:round}
    .dipper-head{fill:#b78755;stroke:#8c633e;stroke-width:1}
    .pots.cycle-glow .pot{animation:potGlow .9s ease-out}
    .pots.emptying .pot{animation:potEmpty .4s ease-out}
    .controls{display:flex;justify-content:center;align-items:center;gap:4px}
    .primary,.secondary{
      border:0;cursor:pointer;font-weight:800;min-height:34px;transition:transform .23s cubic-bezier(.2,.85,.3,1.35),box-shadow .2s,background .2s;font-size:11px
    }
    .primary{min-width:82px;border-radius:999px;padding:8px 10px;background:var(--coral);color:white;box-shadow:0 8px 20px rgba(163,75,59,.2)}
    .primary:hover{transform:scale(1.025);background:var(--coral-dark)}
    .secondary{border-radius:999px;padding:7px 6px;background:transparent;color:var(--muted)}
    .secondary:hover{background:rgba(126,92,70,.08)}
    .stats{display:none}
    .toast{
      position:absolute;left:50%;top:86px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
      background:#fff9f1;color:#82493f;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:750;
      box-shadow:0 8px 24px rgba(70,46,34,.1);transition:opacity .25s,transform .25s
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{
      border:0;border-radius:20px;padding:0;background:#fffaf4;color:var(--ink);width:min(360px,calc(100% - 30px));
      box-shadow:0 28px 80px rgba(54,38,29,.24)
    }
    dialog::backdrop{background:rgba(49,39,34,.23)}
    .settings-wrap{padding:22px}
    .settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .settings-head h2{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0}
    .close-btn{border:0;background:transparent;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:24px;line-height:1}
    .setting-row{display:grid;grid-template-columns:1fr 88px;gap:18px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
    .setting-row label{font-size:14px;font-weight:700}
    .setting-row span{display:block;font-size:12px;color:var(--muted);font-weight:450;margin-top:2px}
    .setting-row input{width:88px;border:1px solid var(--line);border-radius:10px;background:white;padding:8px 9px;text-align:right}
    .save-settings{width:100%;margin-top:14px;border:0;border-radius:999px;padding:11px;background:var(--coral);color:white;font-weight:800;cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(60,112,125,.55);outline-offset:3px}
    .sr-only{position:fixed!important;left:-10000px!important;top:auto!important;width:1px!important;height:1px!important;overflow:hidden!important;white-space:nowrap!important}
    @keyframes fillRise{0%{transform:scaleY(0)}72%{transform:scaleY(1.04)}86%{transform:scaleY(.98)}100%{transform:scaleY(1)}}
    @keyframes surfaceWobble{0%{transform:translateY(9px) scaleX(.72)}65%{transform:translateY(-2px) scaleX(1.04)}82%{transform:translateY(1px) scaleX(.98)}100%{transform:translateY(0) scaleX(1)}}
    @keyframes potGlow{0%,100%{filter:drop-shadow(0 3px 4px rgba(84,58,36,.08))}45%{filter:drop-shadow(0 0 12px rgba(232,169,61,.7))}}
    @keyframes potEmpty{0%{opacity:1}100%{opacity:.45}}
    @keyframes minutePulse{0%{color:inherit}20%{color:#e5484d}55%{color:#e5484d}100%{color:inherit}}
    @media (max-width:620px){
      .phase-rail{top:max(14px,env(safe-area-inset-top));left:14px;transform:none}
      .phase-btn{padding:7px 10px;font-size:11px}
      .icon-btn{width:38px;height:38px}
      .control-dock{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:170px;height:170px;min-height:0;padding:10px 8px;border-radius:18px}
      .task-input{display:none}.phase-label{margin-top:0;font-size:9px}.time{font-size:37.5px;margin:10px 0 15px}
      .controls{display:flex;gap:2px}.primary{min-width:66px;min-height:30px;padding:7px 6px;font-size:9px}.secondary{min-height:30px;padding:5px 4px;font-size:10px}
      .stats{display:none}.top-tools{top:max(14px,env(safe-area-inset-top));right:14px}.phase-label{padding-right:0}
      .pots{left:12px;transform:none;gap:5px;height:46px;padding:2px 8px}.pot{width:34px;height:40px}
    }
    @media (max-height:680px){
      .control-dock{width:188px;height:188px;min-height:0}.task-input{display:none}.time{font-size:40px}.pots{height:43px}.pot{width:36px;height:40px}.stats{display:none}
    }
    @media (max-width:620px) and (max-height:680px){
      .control-dock{width:154px;height:154px}.time{font-size:37.5px}.pot{width:32px;height:38px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <main class="app">
    <nav class="phase-rail" aria-label="Timer phase">
      <button class="phase-btn" data-phase="focus" aria-pressed="true">Focus</button>
      <button class="phase-btn" data-phase="short" aria-pressed="false">Short break</button>
      <button class="phase-btn" data-phase="long" aria-pressed="false">Long break</button>
    </nav>
    <div class="top-tools">
      <button class="icon-btn" id="onboardBtn" aria-label="How this timer works"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H9l-5 4V5Z"/><path d="M8 9.5h8M8 12h5"/></svg></button>
      <button class="icon-btn" id="soundBtn" aria-label="Mute completion sound" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7L8 10H5Z"/><path class="sound-waves" d="M16 9c1.4 1.6 1.4 4.4 0 6M19 6c3.2 3.2 3.2 8.8 0 12"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Timer settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5V10.5l-2-.7a7 7 0 0 0-.7-1.6l.9-1.9-2.1-2.1-1.9.9a7 7 0 0 0-1.6-.7L10.5 2h-3l-.7 2a7 7 0 0 0-1.6.7l-1.9-.9-2.1 2.1.9 1.9a7 7 0 0 0-.7 1.6L0 10.5v3l2 .7a7 7 0 0 0 .7 1.6l-.9 1.9 2.1 2.1 1.9-.9a7 7 0 0 0 1.6.7l.7 2h3l.7-2a7 7 0 0 0 1.6-.7l1.9.9 2.1-2.1-.9-1.9a7 7 0 0 0 .7-1.6l1.8-.7Z" transform="translate(1.5 0) scale(.88)"/></svg></button>
    </div>
    <div class="talk-bubble" id="talkBubble" hidden><p id="talkText"></p><span class="talk-hint">tap to continue &#9656;</span></div>
    <section class="control-dock" aria-label="Pomodoro timer">
      <label class="sr-only" for="taskInput">Focus intention</label>
      <input id="taskInput" class="task-input" maxlength="64" placeholder="What deserves your attention?" autocomplete="off" />
      <div class="phase-label" id="phaseLabel">focus</div>
      <div class="time" id="timeDisplay" role="timer" aria-live="off"><span id="minuteTens">2</span><span class="minute-ones" id="minuteOnes">5</span><span>:</span><span id="secondTens">0</span><span id="secondOnes">0</span></div>
      <div class="controls">
        <button class="secondary" id="resetBtn" aria-label="Reset current timer">Reset</button>
        <button class="primary" id="startBtn">Start focus</button>
        <button class="secondary" id="skipBtn" aria-label="Skip to next phase">Skip</button>
      </div>
      <div class="stats" id="stats">This visit · 0 pomodoros · 0 focus minutes</div>
    </section>
    <div class="pots" id="pots" aria-label="Pomodoro cycle: 0 of 4 focus sessions complete"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <form method="dialog" class="settings-wrap" id="settingsForm">
      <div class="settings-head"><h2 id="settingsTitle">Timer rhythm</h2><button class="close-btn" type="button" aria-label="Close settings">×</button></div>
      <div class="setting-row"><label for="focusMinutes">Focus<span>Deep-work interval</span></label><input id="focusMinutes" type="number" min="1" max="60" value="25" inputmode="numeric" /></div>
      <div class="setting-row"><label for="shortMinutes">Short break<span>Between focus rounds</span></label><input id="shortMinutes" type="number" min="1" max="60" value="5" inputmode="numeric" /></div>
      <div class="setting-row"><label for="longMinutes">Long break<span>After four rounds</span></label><input id="longMinutes" type="number" min="1" max="60" value="15" inputmode="numeric" /></div>
      <button class="save-settings" value="default">Set rhythm</button>
    </form>
  </dialog>

    const monoDigits=[...'𝟶𝟷𝟸𝟹𝟺𝟻𝟼𝟽𝟾𝟿'];
    function titleTime(text){return text.replace(/\d/g,d=>monoDigits[Number(d)])}
    function renderTime(sec){const text=format(sec),digits=text.replace(':','');minuteTens.textContent=digits[0];minuteOnes.textContent=digits[1];secondTens.textContent=digits[2];secondOnes.textContent=digits[3];return text}
    function pulseMinuteOnes(){if(reduced.matches)return;minuteOnes.classList.remove('minute-pulse');void minuteOnes.offsetWidth;minuteOnes.classList.add('minute-pulse');clearTimeout(minutePulseTimer);minutePulseTimer=setTimeout(()=>minuteOnes.classList.remove('minute-pulse'),650)}
    function updateUI(){
      const timeText=renderTime(timer.remaining);document.title=`(${titleTime(timeText)}) · ${phaseNames[timer.phase]}`;phaseLabel.textContent=phaseNames[timer.phase];
      document.body.classList.toggle('break-mode',timer.phase!=='focus');
      document.querySelectorAll('.phase-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.phase===timer.phase)));
      startBtn.textContent=timer.running?'Pause':`Start ${timer.phase==='focus'?'focus':'break'}`;
      statsEl.textContent=`This visit · ${timer.focusCount} ${timer.focusCount===1?'pomodoro':'pomodoros'} · ${timer.totalFocus} focus minutes`;
      timer.progress=timer.phase==='focus'?1-timer.remaining/timer.activeDuration:0;
      renderStill();
    }
    function tick(){if(!timer.running)return;const previousMinuteOnes=Math.floor(Math.max(0,Math.ceil(timer.remaining))/60)%10;timer.remaining=Math.max(0,(timer.endAt-Date.now())/1000);const nextMinuteOnes=Math.floor(Math.max(0,Math.ceil(timer.remaining))/60)%10;if(timer.remaining>0&&nextMinuteOnes!==previousMinuteOnes)pulseMinuteOnes();if(timer.remaining<=0){completePhase()}updateUI()}
    function startPause(){
      if(timer.running){timer.running=false;clearInterval(timer.interval);timer.remaining=Math.max(0,(timer.endAt-Date.now())/1000)}
      else{timer.started=true;timer.running=true;timer.endAt=Date.now()+timer.remaining*1000;timer.interval=setInterval(tick,250);if(soundOn&&!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
      updateUI();
    }
    function setPhase(phase,{clearPots=false}={}){timer.running=false;timer.started=false;clearInterval(timer.interval);timer.phase=phase;timer.activeDuration=durations[phase]*60;timer.remaining=timer.activeDuration;if(clearPots){potsEl.classList.add('emptying');setTimeout(()=>{timer.potsFilled=0;updatePots();potsEl.classList.remove('emptying')},380)}updateUI()}
    function completePhase(){
      timer.running=false;clearInterval(timer.interval);playChime();motion.wiggleStart=performance.now();
      if(timer.phase==='focus'){
        timer.focusCount++;timer.totalFocus+=durations.focus;timer.potsFilled=Math.min(4,timer.potsFilled+1);updatePots(timer.potsFilled-1);
        if(timer.potsFilled===4){potsEl.classList.remove('cycle-glow');void potsEl.offsetWidth;potsEl.classList.add('cycle-glow');setTimeout(()=>potsEl.classList.remove('cycle-glow'),950);setPhase('long');showToast('Four rounds complete — take a real rest.')}else{setPhase('short');showToast('Nicely done. Let the bear rest.')}
      }else{const wasLong=timer.phase==='long';setPhase('focus',{clearPots:wasLong});showToast('Rested. Ready when you are.')}
    }
    function skipPhase(){if(timer.phase==='focus'){setPhase(timer.potsFilled===3?'long':'short')}else setPhase('focus',{clearPots:timer.phase==='long'});showToast('Phase skipped.')}
    function resetPhase(){timer.running=false;timer.started=false;clearInterval(timer.interval);timer.activeDuration=durations[timer.phase]*60;timer.remaining=timer.activeDuration;updateUI()}
    function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
    function playChime(){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime,g=audioCtx.createGain();g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+1.5);[660,990].forEach((freq,i)=>{const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq;o.connect(g);o.start(now+i*.14);o.stop(now+1.55)})}catch(e){}}

    startBtn.addEventListener('click',startPause);document.querySelector('#resetBtn').addEventListener('click',resetPhase);document.querySelector('#skipBtn').addEventListener('click',skipPhase);
    document.querySelectorAll('.phase-btn').forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.phase,{clearPots:b.dataset.phase==='focus'&&timer.phase==='long'})));
    document.addEventListener('keydown',e=>{if(e.target.matches('input')||document.querySelector('#settingsDialog').open)return;if(e.code==='Space'){e.preventDefault();startPause()}if(e.key.toLowerCase()==='r')resetPhase()});
    document.querySelector('#soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.setAttribute('aria-label',soundOn?'Mute completion sound':'Turn on completion sound');document.querySelector('.sound-waves').style.display=soundOn?'':'none';if(soundOn)playChime()});
    const dialog=document.querySelector('#settingsDialog');
    document.querySelector('#settingsBtn').addEventListener('click',()=>dialog.showModal());
    document.querySelector('#onboardBtn').addEventListener('click',startOnboarding);
    document.querySelector('.close-btn').addEventListener('click',()=>dialog.close());
    document.querySelector('#settingsForm').addEventListener('submit',e=>{
      e.preventDefault();
      const applyToIdle=!timer.started;
      for(const key of ['focus','short','long']){const el=document.querySelector(`#${key}Minutes`);durations[key]=Math.max(1,Math.min(60,Number(el.value)||durations[key]))}
      if(applyToIdle){timer.activeDuration=durations[timer.phase]*60;timer.remaining=timer.activeDuration}
      dialog.close();updateUI();showToast(timer.started?'Rhythm saved for the next round.':'Rhythm updated.');
    });

    updatePots();updateUI();
    window.__pomodoro={complete:completePhase,pat:triggerPat,pulseMinute:pulseMinuteOnes,look:(x=0,y=0)=>{if(innerWidth<620||reduced.matches)return false;pointer.hasMouse=true;pointer.tx=THREE.MathUtils.clamp(x,-1,1);pointer.ty=THREE.MathUtils.clamp(y,-1,1);return true},setRemaining:s=>{timer.remaining=Math.max(0,s);timer.endAt=Date.now()+timer.remaining*1000;updateUI()},state:timer};
  </script>
</body>
</html>
